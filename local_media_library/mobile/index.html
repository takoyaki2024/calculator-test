<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Local Media Library</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><strong>Local Media Library</strong><span>自宅内・閲覧専用</span></header>
<section id="pair"><h1>PCへの接続</h1><p>PCに表示される8桁の接続コードを入力してください。</p><form id="pairform"><input id="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" required aria-label="接続コード"><button>接続する</button></form><p id="pairmsg"></p></section>
<main id="library" hidden><nav><button data-category="manga">漫画</button><button data-category="image">画像</button><button data-category="video">動画</button></nav><div class="tools"><input id="search" placeholder="作品名で検索" maxlength="200" aria-label="検索"><select id="sort" aria-label="ソート"><option value="newest">新着順</option><option value="oldest">古い順</option><option value="title">タイトル順</option></select></div><button id="backwork" hidden>作品一覧に戻る</button><p id="status"></p><div id="grid"></div><div class="paging"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></div></main>
<section id="viewer" hidden><button id="close">一覧に戻る</button><h2 id="title"></h2><div id="display"></div><div id="reader" hidden><button id="before">前のページ</button><span id="position"></span><button id="after">次のページ</button></div><p id="viewmsg"></p></section></body></html>
