<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calculator</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#f4f4f4;margin:0;padding:24px;display:flex;justify-content:center}.app{width:min(420px,100%);background:white;border-radius:16px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}input{width:100%;box-sizing:border-box;font-size:28px;padding:14px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px}.result{font-size:20px;font-weight:700;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{font-size:18px;padding:14px;border:0;border-radius:10px;background:#eee}.wide{grid-column:span 2}.history{margin-top:16px;max-height:180px;overflow:auto}.history div{padding:6px 0;border-bottom:1px solid #eee}
  </style>
</head>
<body>
<div class="app">
  <input id="expr" inputmode="decimal" autocomplete="off" aria-label="式">
  <div id="result" class="result">Result: -</div>
  <div class="grid" id="buttons"></div>
  <div class="history" id="history"></div>
</div>
<script>
const expr=document.getElementById('expr');const result=document.getElementById('result');const history=document.getElementById('history');
let memory=0,lastValue=0;
function safeEval(text){text=text.trim();if(!text||text.length>200)throw new Error('invalid');if(!/^[0-9+\-*/().\s]+$/.test(text))throw new Error('invalid');const value=Function('"use strict";return ('+text+')')();if(typeof value!=='number'||!Number.isFinite(value))throw new Error('invalid');return value;}
function calculate(){try{const value=safeEval(expr.value);lastValue=value;result.textContent='Result: '+format(value);const row=document.createElement('div');row.textContent=expr.value+' = '+format(value);history.prepend(row);while(history.children.length>10)history.lastChild.remove();}catch{result.textContent='Result: error';}}
function format(v){return Number.isInteger(v)?String(v):String(Number(v.toPrecision(12)));}
function append(v){expr.value+=v;expr.focus();}
function clearAll(){expr.value='';result.textContent='Result: -';}
function percent(){try{const value=safeEval(expr.value)/100;expr.value=format(value);result.textContent='Result: '+format(value);}catch{result.textContent='Result: error';}}
function backspace(){expr.value=expr.value.slice(0,-1);}
const buttons=[['MC',()=>memory=0],['MR',()=>append(format(memory))],['M+',()=>memory+=lastValue],['M-',()=>memory-=lastValue],['7',()=>append('7')],['8',()=>append('8')],['9',()=>append('9')],['÷',()=>append('/')],['4',()=>append('4')],['5',()=>append('5')],['6',()=>append('6')],['×',()=>append('*')],['1',()=>append('1')],['2',()=>append('2')],['3',()=>append('3')],['-',()=>append('-')],['0',()=>append('0')],['.',()=>append('.')],['+',()=>append('+')],['(',()=>append('(')],[ ')',()=>append(')')],['%',percent],['⌫',backspace],['C',clearAll],['=',calculate]];
for(const [label,fn] of buttons){const b=document.createElement('button');b.textContent=label.trim();b.onclick=fn;document.getElementById('buttons').appendChild(b);}
expr.addEventListener('keydown',e=>{if(e.key==='Enter')calculate();if(e.key==='Escape')clearAll();});
</script>
</body>
</html>
