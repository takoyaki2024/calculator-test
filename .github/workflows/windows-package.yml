name: Windows package
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Build portable folder
        run: python -m PyInstaller --clean --noconfirm packaging/local_media_library.spec
      - name: Packaged startup smoke
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "local-media-smoke"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:LOCAL_MEDIA_LIBRARY_ROOT = $root
          $exe = (Resolve-Path "dist/LocalMediaLibrary/LocalMediaLibrary.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Packaged real decode/control probe
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/LocalMediaLibrary/LocalMediaLibrary.exe").Path
          $fixture = (Resolve-Path "tests/fixtures/baseline.mp4").Path
          $report = Join-Path (Resolve-Path "dist").Path "video-probe.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--video-probe", $fixture, "--probe-report", $report) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path dist/video-probe.json) { Get-Content dist/video-probe.json }
            exit $process.ExitCode
          }
          Get-Content dist/video-probe.json
      - name: Packaged representative cover child-process probe
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/LocalMediaLibrary/LocalMediaLibrary.exe").Path
          $fixtures = (Resolve-Path "tests/fixtures").Path
          $report = Join-Path (Resolve-Path "dist").Path "work-cover-probe.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--work-cover-probe", $fixtures, "--probe-report", $report) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path dist/work-cover-probe.json) { Get-Content dist/work-cover-probe.json }
            exit $process.ExitCode
          }
          Get-Content dist/work-cover-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: LocalMediaLibrary-Windows
          path: |
            dist/LocalMediaLibrary-Windows.zip
            dist/video-probe.json
            dist/work-cover-probe.json
          retention-days: 7
          if-no-files-found: error
